info:
  title: APIs Prosper - Stellar Protocol Internal
  description: APIs Prosper - Stellar Protocol internal documentation
  version: '2.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        username:
          type: string
          description: Nombre de usuario
          example: usuario
        password:
          type: string
          description: Contraseña
          example: miPassword123
      required:
        - username
        - password
    ChangePasswordDto:
      type: object
      properties:
        oldPassword:
          type: string
          description: Contraseña antigua
          example: oldPassword
        newPassword:
          type: string
          description: Contraseña nueva
          example: newPassword
      required:
        - oldPassword
        - newPassword
    CreateTransaccionDto:
      type: object
      properties:
        amount:
          type: number
        asset:
          type: string
        from:
          type: string
        to:
          type: string
        memo:
          type: string
        status:
          type: string
          enum:
            - Pendiente
            - Rechazada
            - Completada
        txType:
          type: string
          enum:
            - Mint
            - Depósito
            - Retiro
            - Transferencia
            - Staking
        txHash:
          type: string
        webhookStatus:
          type: string
          enum:
            - Pendiente
            - Recibido
            - Rechazado
        walletFromId:
          type: number
        walletToId:
          type: number
      required:
        - amount
        - asset
        - from
        - to
        - txType
        - webhookStatus
        - walletFromId
        - walletToId
    UpdateTransaccionDto:
      type: object
      properties:
        id:
          type: number
        amount:
          type: number
        asset:
          type: string
        from:
          type: string
        to:
          type: string
        memo:
          type: string
        status:
          type: string
          enum:
            - Pendiente
            - Rechazada
            - Completada
        txType:
          type: string
          enum:
            - Mint
            - Depósito
            - Retiro
            - Transferencia
            - Staking
        txHash:
          type: string
        webhookStatus:
          type: string
          enum:
            - Pendiente
            - Recibido
            - Rechazado
        walletFromId:
          type: number
        walletToId:
          type: number
      required:
        - id
    BalancesDto:
      type: object
      properties:
        asset:
          type: string
          description: Asset symbol
        balance:
          type: number
          description: Balance amount
        updatedAt:
          type: string
          description: Last updated timestamp (ISO)
      required:
        - asset
        - balance
    CreateWalletDto:
      type: object
      properties:
        prosperId:
          type: string
          description: Prosper identifier
        address:
          type: string
          description: Wallet address
        secret:
          type: string
          description: Wallet secret
        balances:
          description: Balances array
          type: array
          items:
            $ref: '#/components/schemas/BalancesDto'
        status:
          type: string
          enum:
            - active
            - inactive
            - blocked
            - suspended
          description: Wallet status
      required:
        - prosperId
        - address
        - secret
    UpdateWalletDto:
      type: object
      properties:
        id:
          type: number
          description: Wallet id
        balances:
          description: Balances array
          type: array
          items:
            $ref: '#/components/schemas/BalancesDto'
        status:
          type: string
          enum:
            - active
            - inactive
            - blocked
            - suspended
          description: Wallet status
      required:
        - id
    CreateFundDto:
      type: object
      properties:
        initialAmount:
          type: string
          description: Cantidad inicial a emitir
        homeDomain:
          type: string
          description: Dominio home para SEP-10 / well-known
        prosperTxId:
          type: string
          description: Identificador de la transacción en Prosper
    MintDto:
      type: object
      properties:
        amount:
          type: string
        reason:
          type: string
        prosperTxId:
          type: string
      required:
        - amount
        - prosperTxId
    NewUserDto:
      type: object
      properties:
        userReferenceId:
          type: string
        prosperTxId:
          type: string
          description: Identificador de la transacción en Prosper
      required:
        - userReferenceId
        - prosperTxId
    DepositDto:
      type: object
      properties:
        prosperTxId:
          type: string
          description: Identificador de la transacción en Prosper
        amount:
          type: string
        userReferenceId:
          type: string
          description: >-
            Identificador de referencia del usuario en el sistema externo,
            OPCIONAL
        address:
          type: string
          description: >-
            Dirección de la wallet del usuario, valor interno del protocolo,
            OPCIONAL
      required:
        - prosperTxId
        - amount
    TransferMetadataDto:
      type: object
      properties:
        price:
          type: number
        currency:
          type: string
        contractRef:
          type: string
        transferType:
          type: string
    TransferDto:
      type: object
      properties:
        amount:
          type: string
        fromUserId:
          type: string
        toUserId:
          type: string
        prosperTxId:
          type: string
          description: Identificador de la transacción en Prosper
        metadata:
          $ref: '#/components/schemas/TransferMetadataDto'
      required:
        - amount
        - fromUserId
        - toUserId
        - prosperTxId
